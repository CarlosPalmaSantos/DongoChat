name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Se activa al publicar tags como v1.0.0, v1.2.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configurar Java JDK (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias
        run: pnpm install

      # 1. Actualizar la versión en apps/frontend/package.json
      - name: Actualizar versión en package.json del Frontend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Actualizando frontend a la versión $VERSION..."
          npm --prefix apps/frontend version $VERSION --no-git-tag-version

      # 2. Compilar la librería compartida dongo-shared
      - name: Compilar dongo-shared
        run: pnpm --filter dongo-shared build

      # 3. Compilar el Frontend de React / Vite
      - name: Compilar Frontend
        run: pnpm --filter frontend build

      # 4. Sincronizar artefactos con Capacitor (Android)
      - name: Sincronizar Capacitor
        run: pnpm --filter frontend exec cap sync

      # 5. Generar el APK de Android
      - name: Compilar APK Debug
        run: |
          cd apps/frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. Comprimir la carpeta dist del Frontend
      - name: Comprimir ./dist del Frontend
        run: |
          cd apps/frontend
          zip -r ../../frontend-dist.zip dist

      # 7. Generar el manifest.json para auto-update
      - name: Generar manifest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CHECKSUM=$(sha256sum frontend-dist.zip | cut -d ' ' -f1)
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/frontend-dist.zip",
            "checksum": "$CHECKSUM"
          }
          EOF
          cat manifest.json

      # 8. Publicar la Release en GitHub con los binarios
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend-dist.zip
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
