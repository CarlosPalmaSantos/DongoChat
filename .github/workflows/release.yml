name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Se dispara cuando creas un tag como v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configurar Java JDK (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: pnpm install

      - name: Actualizar versión en package.json del Frontend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Actualizando frontend a la versión $VERSION..."
          npm --prefix apps/frontend version $VERSION --no-git-tag-version

      # Step 1: Compilar el Frontend y generar APK Debug
      - name: Build Frontend y Sync Capacitor
        run: |
          pnpm --filter frontend build
          pnpm --filter frontend exec cap sync

      - name: Compilar APK Debug
        run: |
          cd apps/frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Step 2: Crear el archivo comprimido del dist del Frontend
      - name: Comprimir ./dist del Frontend
        run: |
          cd apps/frontend
          zip -r ../../frontend-dist.zip dist

      # Step 3: Crear la Release en GitHub y subir los assets
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
