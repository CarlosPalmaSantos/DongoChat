name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Se activa al publicar tags como v1.0.0, v1.2.3, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Instalar dependencias
        run: pnpm install

      - name: Actualizar versiones
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Versión visual: $VERSION"
          echo "Version code Android: $VERSION_CODE"

          echo "Actualizando frontend a la versión $VERSION..."
          npm --prefix apps/frontend version "$VERSION" --no-git-tag-version

          echo "Actualizando Android..."
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" \
            apps/frontend/android/app/build.gradle

          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" \
            apps/frontend/android/app/build.gradle

          echo "Contenido de las versiones Android:"
          grep -E "versionCode|versionName" apps/frontend/android/app/build.gradle

      - name: Compilar dongo-shared
        run: pnpm --filter dongo-shared build

      - name: Compilar Frontend
        run: pnpm --filter frontend build
        env:
          VITE_BASE_PATH: /
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Subir dist como artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

  release-web:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Comprimir ./dist del Frontend
        run: |
          cd apps/frontend/dist
          zip -r ../../../frontend-dist.zip .

      - name: Generar manifest.json
        run: |
          CHECKSUM=$(sha256sum frontend-dist.zip | cut -d ' ' -f1)
          cat > manifest.json <<EOF
          {
            "version": "${{ needs.build.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/frontend-dist.zip",
            "checksum": "$CHECKSUM"
          }
          EOF
          cat manifest.json

      - name: Crear/Actualizar GitHub Release (web assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            frontend-dist.zip
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Agregar CNAME para dominio propio
        run: echo "www.dongo.magin.top" > dist/CNAME

      - name: Fallback SPA (404.html) para rutas con history mode
        run: cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-android:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configurar Java JDK (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: pnpm install

      - name: Descargar dist ya compilado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Crear google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > apps/frontend/android/app/google-services.json

      - name: Sincronizar Capacitor
        run: pnpm --filter frontend exec cap sync

      - name: Compilar APK Debug
        run: |
          cd apps/frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Dorg.gradle.internal.repository.max.tentatives=5 \
            -Dorg.gradle.internal.repository.initial.backoff=2000 \
            -Dorg.gradle.internal.http.connectionTimeout=90000 \
            -Dorg.gradle.internal.http.socketTimeout=90000

      - name: Subir APK a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
