name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Se activa al publicar tags como v1.0.0, v1.2.3, etc.

jobs:
  release-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Instalar dependencias
        run: pnpm install

      - name: Actualizar versión en package.json del Frontend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Actualizando frontend a la versión $VERSION..."
          npm --prefix apps/frontend version $VERSION --no-git-tag-version

      - name: Compilar dongo-shared
        run: pnpm --filter dongo-shared build

      - name: Compilar Frontend
        run: pnpm --filter frontend build

      - name: Comprimir ./dist del Frontend
        run: |
          cd apps/frontend/dist
          zip -r ../../../frontend-dist.zip .

      - name: Generar manifest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CHECKSUM=$(sha256sum frontend-dist.zip | cut -d ' ' -f1)
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/frontend-dist.zip",
            "checksum": "$CHECKSUM"
          }
          EOF
          cat manifest.json

      - name: Crear/Actualizar GitHub Release (web assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            frontend-dist.zip
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    needs: release-web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configurar Java JDK (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Cachea ~/.gradle y reduce llamadas repetidas a Maven Central
      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: pnpm install

      - name: Actualizar versión en package.json del Frontend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm --prefix apps/frontend version $VERSION --no-git-tag-version

      - name: Compilar dongo-shared
        run: pnpm --filter dongo-shared build

      - name: Compilar Frontend
        run: pnpm --filter frontend build

      - name: Sincronizar Capacitor
        run: pnpm --filter frontend exec cap sync

      - name: Compilar APK Debug
        run: |
          cd apps/frontend/android
          chmod +x gradlew
          # Reintentos ante 429/timeouts de Maven Central
          ./gradlew assembleDebug \
            -Dorg.gradle.internal.repository.max.tentatives=5 \
            -Dorg.gradle.internal.repository.initial.backoff=2000 \
            -Dorg.gradle.internal.http.connectionTimeout=90000 \
            -Dorg.gradle.internal.http.socketTimeout=90000

      - name: Subir APK a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
